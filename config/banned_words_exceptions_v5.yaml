exceptions:
  - rule: bgetattr
    path: ^scripts/vendor/m3addon/m3\.py$
    rationale: Vendored third-party M3 parser uses reflective attribute reads for schema-driven structures.
    owner: sc2
    review_date: '2026-11-10'
    removal: Remove when the vendored parser is replaced or updated upstream.
  - rule: bsetattr
    path: ^scripts/vendor/m3addon/m3\.py$
    rationale: Vendored third-party M3 parser uses reflective attribute writes for schema-driven structures.
    owner: sc2
    review_date: '2026-11-10'
    removal: Remove when the vendored parser is replaced or updated upstream.
  - rule: bhasattr
    path: ^scripts/vendor/m3addon/m3\.py$
    rationale: Vendored third-party M3 parser checks dynamic fields during schema parsing.
    owner: sc2
    review_date: '2026-11-10'
    removal: Remove when the vendored parser is replaced or updated upstream.
  - rule: bunpack-b
    path: ^scripts/vendor/m3addon/m3\.py$
    rationale: Vendored third-party M3 parser uses struct unpack for binary decoding.
    owner: sc2
    review_date: '2026-11-10'
    removal: Remove when the vendored parser is replaced or updated upstream.
  - rule: bmaybe-b
    path: ^scripts/vendor/m3addon/structures\.xml$
    rationale: Vendored third-party structure metadata contains the word in a field description.
    owner: sc2
    review_date: '2026-11-10'
    removal: Remove when the vendored parser is replaced or updated upstream.
  - rule: bplaceholders-b
    path: ^webviewer/public/index\.html$
    rationale: The HTML input attribute placeholder sets the grey hint text of the search boxes. It is the standard attribute name, not placeholder code.
    owner: sc2
    review_date: '2026-11-21'
    removal: Remove when the search boxes no longer show hint text.
  - rule: bplaceholders-b
    path: ^webviewer/public/components\.js$
    rationale: The DOM property input.placeholder sets the grey hint text of the picker search box. It is the standard property name, not placeholder code.
    owner: sc2
    review_date: '2026-11-21'
    removal: Remove when the picker search box no longer shows hint text.
  - rule: bskeleton-b
    path: ^webviewer/patches/0015-m3-mouse-over-highlight-instance\.highlight-u_highlig\.patch$
    rationale: The exported renderer patch shows the upstream mdx-m3-viewer bone hierarchy class M3Skeleton as diff context. Not skeleton code.
    owner: sc2
    review_date: '2026-11-21'
    removal: Remove when this patch no longer carries the bone hierarchy lines as context.
  - rule: bskeleton-b
    path: ^webviewer/patches/0017-m3-draw-displacement-materials-over-a-copy-of-the-fr\.patch$
    rationale: The exported renderer patch reads the animated displacement strength through instance.skeleton, the upstream mdx-m3-viewer bone hierarchy field, and shows M3Skeleton as diff context. Not skeleton code.
    owner: sc2
    review_date: '2026-11-21'
    removal: Remove when the displacement strength no longer reads through the bone hierarchy.
  - rule: bskeleton-b
    path: ^webviewer/patches/0018-m3-apply-layer-UV-offset-angle-and-tiling\.patch$
    rationale: The exported renderer patch reads the animated layer UV offset, angle and tiling through instance.skeleton, the upstream mdx-m3-viewer bone hierarchy field. Not skeleton code.
    owner: sc2
    review_date: '2026-11-21'
    removal: Remove when the layer UV transform no longer reads through the bone hierarchy.
