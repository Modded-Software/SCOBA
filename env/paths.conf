# Where the project writes (operator 2026-11-25; docs/specifications/SPEC-PATHS.md).
# Read only by scripts/paths.sh, which derives and exports every path.
# One KEY=VALUE per line. A value may name $HOME and nothing else.
# A variable already in the environment wins over its line here.
#
# The repository holds source only. Its disk is encrypted; heavy writes there
# starve the desktop. Built maps, test maps, runs, texture stores, extracted
# game files, temp folders and the Python and Node environments go below
# SC2_WORK, on the fast disk.
SC2_WORK=/mnt/ws-fast/sc2work
# Extracted game resources (scripts/sc2res.py).
SC2RES=/mnt/ws-fast/sc2res
# The built map, below SC2_OUT.
SC2_MAP_NAME=SCOBA256.SC2Map
# The Wine prefix of the game, its drive C below the prefix, and its
# Windows user. Proton-style prefix: pfx/drive_c; plain Wine: drive_c.
# On the fast disk since 2026-11-25 (was $HOME/Games/battlenet-prefix).
BNET_PREFIX=/mnt/ws-fast/battlenet-prefix
SC2_WINE_DRIVE=pfx/drive_c
SC2_WINE_USER=steamuser
