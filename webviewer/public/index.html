<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- No icon file: an empty one, so the browser asks for no /favicon.ico (a 404). -->
  <link rel="icon" href="data:,">
  <title>model viewer</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <canvas id="view"></canvas>
  <div id="side">
  <aside id="gallery">
    <div id="gallery-top">
      <select id="dataset" title="dataset: where the lists and new instances come from"></select>
      <!-- One tab and one pane per category of the game, built by src/page/ui/gallery. -->
      <nav id="tabs"></nav>
    </div>
  </aside>
  <aside id="instances">
    <div id="scene-head"><span>instances <span id="instance-count"></span></span><button id="clear" class="danger" title="Remove All Instances">clear</button></div>
    <input id="instance-search" type="search" placeholder="search instances by name, id or file" autocomplete="off" spellcheck="false">
    <ul id="scene" class="rows"></ul>
  </aside>
  <!-- One tab per game the server lists, built by src/page/ui/gametabs.ts. -->
  <nav id="game-tabs" aria-label="games"></nav>
  <button id="gallery-handle" class="drawer-handle" title="hide the gallery" aria-controls="gallery"></button>
  <button id="instances-handle" class="drawer-handle" title="hide the instances" aria-controls="instances"></button>
  </div>
  <nav id="view-tools">
    <div id="scenes">
      <button id="scenes-button" title="scenes: open, make, rename, delete, export, import"></button>
      <ul id="scenes-list" hidden></ul>
    </div>
    <input id="scenes-import-file" type="file" accept=".json,application/json" hidden>
    <div id="landmarks">
      <button id="landmarks-button" title="landmarks: jump to a saved view"></button>
      <ul id="landmarks-list" hidden></ul>
    </div>
    <button id="landmark-pin" title="pin: save this view as a landmark"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path fill="currentColor" d="M8 1a5 5 0 0 0-5 5c0 3.5 5 9 5 9s5-5.500 5-9a5 5 0 0 0-5-5zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z"/></svg></button>
    <button id="grid-toggle" class="on" title="hex grid ground">grid</button>
    <button id="ground-button" title="choose a ground texture" hidden>ground</button>
    <button id="sky-button" title="choose a skybox">sky</button>
  </nav>
  <button id="controls-button" title="controls: mouse buttons, keys and rates" aria-label="controls"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M6.6 1h2.8l.4 2 1.3.7 1.9-.8 1.4 2.4-1.5 1.4v1.5l1.5 1.4-1.4 2.4-1.9-.8-1.3.7-.4 2H6.6l-.4-2-1.3-.7-1.9.8-1.4-2.4 1.5-1.4V6.7L1.6 5.3 3 2.9l1.9.8 1.3-.7zM8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg></button>
  <!-- The page is one bundle (src/page/main.ts). When it does not load, nothing of the page runs: these lines say so, naming the file. -->
  <p id="load-failure" role="alert" hidden></p>
  <script src="/vendor/renderer.js" onerror="const text = 'page bundle did not load: ' + this.getAttribute('src') + '; restart the viewer server'; console.error('scobaeditor: ' + text); const node = document.getElementById('load-failure'); node.textContent = text; node.hidden = false;"></script>
</body>
</html>
